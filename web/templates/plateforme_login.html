<!DOCTYPE html>
<html lang="fr" data-theme="{{ theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion {{ plateforme }}</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg: #0f0f13; --bg2: #1a1a24; --text: #e8e8f0;
            --accent: #7c5cbf; --border: #2e2e42;
        }
        [data-theme="light"] {
            --bg: #f5f5fa; --bg2: #ffffff; --text: #1a1a2e;
            --border: #d0d0e0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 500px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
        }
        
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }
        
        .step {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin: 1rem 0;
            text-align: left;
        }
        
        .step-number {
            display: inline-block;
            width: 28px;
            height: 28px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-weight: 700;
            margin-right: 0.5rem;
        }
        
        .btn {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin: 1rem 0.5rem;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .btn:hover { opacity: 0.9; }
        
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #status {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 8px;
            display: none;
        }
        
        #status.success {
            background: #1a3a2a;
            color: #4caf82;
            border: 1px solid #4caf82;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> Connexion {{ plateforme|capitalize }}</h1>
        
        <div class="step">
            <span class="step-number">1</span>
            Cliquez sur "Ouvrir {{ plateforme }}"
        </div>
        
        <div class="step">
            <span class="step-number">2</span>
            Connectez-vous avec vos identifiants
        </div>
        
        <div class="step">
            <span class="step-number">3</span>
            Revenez ici et cliquez "J'ai terminé"
        </div>
        
        <a href="{{ login_url }}" target="_blank" class="btn" id="btn-ouvrir">
             Ouvrir {{ plateforme }}
        </a>
        
        <button onclick="terminer()" class="btn btn-secondary" id="btn-terminer" disabled>
            ✔ J'ai terminé
        </button>
        
        <div id="status"></div>
    </div>
    
    <script>
        const plateforme = "{{ plateforme }}";
        let ouvert = false;
        
        // Active le bouton "Terminé" après 3 secondes
        document.getElementById('btn-ouvrir').addEventListener('click', () => {
            ouvert = true;
            setTimeout(() => {
                document.getElementById('btn-terminer').disabled = false;
            }, 3000);
        });
        
        async function terminer() {
            const status = document.getElementById('status');
            status.style.display = 'block';
            status.className = '';
            status.textContent = '⏳ Sauvegarde de la session...';
            
            try {
                const resp = await fetch(`/api/plateformes/${plateforme}/sauvegarder-session`, {
                    method: 'POST',
                });
                const data = await resp.json();
                
                if (data.ok) {
                    status.className = 'success';
                    status.textContent = '✔ Session sauvegardée ! Vous pouvez fermer cette fenêtre.';
                    
                    setTimeout(() => {
                        window.close();
                    }, 2000);
                } else {
                    status.textContent = '✘ ' + data.message;
                }
            } catch(e) {
                status.textContent = '✘ Erreur réseau';
            }
        }
    </script>
</body>
</html>
