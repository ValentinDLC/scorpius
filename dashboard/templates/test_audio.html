<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Capture Audio - SCORPIUS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container col-md-7 mx-auto bg-white p-4 rounded shadow">
        <h2 class="mb-3">🎙️ Test Capture Audio</h2>
        <p class="text-muted">
            Démarre, parle 15-20s, puis arrête. En mode privacy, aucun audio n'est sauvegardé.
        </p>

        <button id="btn-rec" class="btn btn-primary w-100 mb-3">🎙️ Démarrer l'appel</button>
        <div id="status" class="alert alert-secondary text-center">⏸️ Prêt</div>

        <h5>📝 Transcription live</h5>
        <div id="transcript" class="border rounded p-3 mb-3 bg-light" style="min-height: 110px;">
            <span class="text-muted">Aucune transcription pour le moment.</span>
        </div>

        <h5>Logs</h5>
        <div id="logs" class="mt-2 p-2 bg-dark text-light font-monospace small" style="height: 170px; overflow-y: auto;"></div>
    </div>

    <script src="/static/js/audio_capture.js"></script>
    <script>
        const logBox = document.getElementById('logs');
        const transcriptBox = document.getElementById('transcript');

        const log = (msg) => {
            logBox.innerHTML += `<div>${new Date().toLocaleTimeString()} → ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        };

        const LABELS = {
            connected:    '🟢 Connecté au serveur',
            recording:    '🔴 Enregistrement en cours...',
            stopped:      '⏹️ Arrêté',
            disconnected: '🔌 Déconnecté',
            error:        '❌ Erreur WebSocket',
            mic_error:    '🚫 Accès micro refusé'
        };

        function onStatus(status) {
            const label = LABELS[status] || status;
            document.getElementById('status').textContent = label;
            document.getElementById('btn-rec').textContent =
                status === 'recording' ? '⏹️ Arrêter' : '🎙️ Démarrer';
            log(label);
        }

        function onEvent(event) {
            if (event.type === 'server_status') {
                log(`privacy=${event.privacy_mode} save_audio=${event.save_audio} live_stt=${event.live_stt}`);
            }

            if (event.type === 'transcript') {
                transcriptBox.textContent = event.text;
                log('📝 Transcript live reçu');
            }

            if (event.type === 'stt_error') {
                log(`⚠️ STT error: ${event.error}`);
            }

            if (event.type === 'call_saved') {
                log(`📞 Call saved id=${event.call_id} audio_saved=${event.audio_saved}`);
            }
        }

        window._capture = null;

        document.getElementById('btn-rec').addEventListener('click', () => {
            if (window._capture && window._capture.isRecording) {
                window._capture.stop();
                window._capture = null;
            } else {
                transcriptBox.innerHTML = '<span class="text-muted">En attente de transcription...</span>';
                window._capture = new AudioCapture(1, onStatus, onEvent);
                window._capture.start();
            }
        });
    </script>
</body>
</html>
